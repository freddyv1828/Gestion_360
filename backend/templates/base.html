<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestión 360{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Barra de Navegación Superior Moderna -->
    <header class="bg-slate-900 border-b border-slate-800 shadow-md px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-4">
            <h1 class="text-xl font-extrabold tracking-wide text-emerald-400">GESTIÓN 360</h1>
            <span class="text-xs text-slate-400 border-l border-slate-700 pl-4">
                {{ session.get('company_name', 'Panel Corporativo') }}
            </span>
        </div>
        <div class="flex items-center gap-4">
            <a href="/dashboard" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-lg border border-slate-700 transition">
                🏠 Dashboard
            </a>
            <span class="text-xs bg-emerald-500/10 text-emerald-400 px-3 py-1.5 rounded-full border border-emerald-500/20 font-medium">
                Sistema Activo
            </span>
        </div>
    </header>

    <!-- Contenedor Principal a Ancho Completo -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-6 py-8">
        <!-- Título de Sección -->
        <div class="mb-6">
            <h2 class="text-2xl font-bold text-white">
                {% block header_title %}Panel de Control{% endblock %}
            </h2>
        </div>

        <!-- Contenido Dinámico de las Vistas -->
        {% block content %}{% endblock %}
    </main>

    <!-- Pie de Página -->
    <footer class="bg-slate-900 border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        Gestión 360 &copy; 2026 — Todos los derechos reservados.
    </footer>

</body>
</html>
