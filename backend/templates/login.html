<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión 360 - Acceso Corporativo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center h-screen">

    <div class="bg-slate-800 border border-slate-700 p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-emerald-400">GESTIÓN 360</h1>
            <p class="text-sm text-slate-400 mt-1">Plataforma Administrativa y Logística</p>
        </div>

        <form action="/api/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Correo Electrónico</label>
                <input type="email5" name="email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-emerald-500" placeholder="admin@alpinca.com">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Contraseña / Clave</label>
                <input type="password" name="password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-emerald-500" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg transition duration-200">
                Iniciar Sesión
            </button>
        </form>

        <div class="mt-6 text-center border-t border-slate-700 pt-4">
            <p class="text-sm text-slate-400">¿Nueva empresa a bordo?</p>
            <a href="/register-business" class="text-emerald-400 hover:underline text-sm font-semibold mt-1 inline-block">
                Ir al Onboarding y Registro Corporativo →
            </a>
        </div>
    </div>

</body>
</html>
